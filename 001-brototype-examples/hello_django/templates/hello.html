{% for movie_obj in movies %}
<h1>Title : {{ movie_obj.title |upper }} </h1>
<p>Summary : {{ movie_obj.summary | default:"No summary available" }} </p>
<h4>Year: {{ movie_obj.year }} </h4>
{% if movie_obj.success %}
<p>movie was successful</p>
{% else %}
<p>movie was fail</p>\
{% endif %}
{% endfor %}
