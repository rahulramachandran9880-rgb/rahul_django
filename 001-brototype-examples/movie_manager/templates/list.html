{%extends 'blank_layout.html' %}
{% load static %}
{% block content %}
<h1>List Movies</h1>

{% for movie_obj in movies %}
<h1>Title : {{ movie_obj.title |upper }} </h1>
<img src="{% static 'images/' %}{{ movie_obj.img }}">
<p>Summary : {{ movie_obj.description | default:"No summary available" }} </p>
<h4>Year: {{ movie_obj.year }} </h4>
{% endfor %}

{%endblock content %}
